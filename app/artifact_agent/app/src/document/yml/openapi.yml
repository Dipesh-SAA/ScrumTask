openapi: 3.0.3
info:
  title: Simple Calculator API
  version: 1.0.0
  description: API for performing basic calculator operations
servers:
- url: https://api.example.com/v1
  description: Production server
paths:
  /calculations:
    post:
      tags:
      - calculations
      summary: Perform a calculation
      operationId: createCalculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationRequest'
      responses:
        '200':
          description: Successful calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
components:
  schemas:
    CalculationRequest:
      type: object
      properties:
        operand1:
          type: number
        operand2:
          type: number
        operation:
          type: string
          enum:
          - add
          - subtract
          - multiply
          - divide
      required:
      - operand1
      - operand2
      - operation
    CalculationResponse:
      type: object
      properties:
        result:
          type: number
        operation:
          type: string
        operand1:
          type: number
        operand2:
          type: number
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer
x-backend: react
