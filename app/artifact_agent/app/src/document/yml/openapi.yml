openapi: 3.0.3
info:
  title: Secure API Endpoint for Initiating Password Reset Requests
  version: 1.0.0
  description: API for password reset request initiation
servers:
- url: https://api.example.com/v1
  description: Production server
paths:
  /password-reset-requests:
    post:
      tags:
      - PasswordResetRequest
      summary: Initiate password reset request
      operationId: createPasswordResetRequest
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestCreateRequest'
      responses:
        '201':
          description: Password reset request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    PasswordResetRequestCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        resetToken:
          type: string
      required:
      - email
    PasswordResetRequestResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        resetToken:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-backend: .net
x-frontend: asp.net core web api
